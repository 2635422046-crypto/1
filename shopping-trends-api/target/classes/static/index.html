<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>购物趋势分析系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">购物趋势分析系统</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" href="#dashboard">仪表盘</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#data">数据管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#import">数据导入</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../../api-documentation.md" target="_blank">API文档</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-md-3">
                <div class="list-group">
                    <a href="#" class="list-group-item list-group-item-action active" data-type="gender">按性别统计</a>
                    <a href="#" class="list-group-item list-group-item-action" data-type="age">按年龄段统计</a>
                    <a href="#" class="list-group-item list-group-item-action" data-type="category">按商品类别统计</a>
                    <a href="#" class="list-group-item list-group-item-action" data-type="season">按季节统计</a>
                    <a href="#" class="list-group-item list-group-item-action" data-type="location">按地区统计</a>
                    <a href="#" class="list-group-item list-group-item-action" data-type="date">按日期统计</a>
                    <a href="#" class="list-group-item list-group-item-action" data-type="customer">客户购买统计</a>
                </div>
            </div>
            <div class="col-md-9">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title" id="chart-title">按性别统计购物金额</h5>
                    </div>
                    <div class="card-body">
                        <div id="chart-container" style="width: 100%; height: 500px;"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title">购物记录数据</h5>
                    </div>
                    <div class="card-body">
                        <div class="row mb-3">
                            <div class="col-md-3">
                                <select id="category-filter" class="form-select">
                                    <option value="">全部类别</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <select id="gender-filter" class="form-select">
                                    <option value="">全部性别</option>
                                    <option value="Male">男性</option>
                                    <option value="Female">女性</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <select id="season-filter" class="form-select">
                                    <option value="">全部季节</option>
                                    <option value="Spring">春季</option>
                                    <option value="Summer">夏季</option>
                                    <option value="Fall">秋季</option>
                                    <option value="Winter">冬季</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <button id="search-btn" class="btn btn-primary">搜索</button>
                            </div>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-striped table-hover">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>日期</th>
                                        <th>客户ID</th>
                                        <th>年龄</th>
                                        <th>性别</th>
                                        <th>商品</th>
                                        <th>类别</th>
                                        <th>金额</th>
                                        <th>地区</th>
                                        <th>尺寸</th>
                                        <th>颜色</th>
                                        <th>季节</th>
                                        <th>评分</th>
                                        <th>订阅状态</th>
                                        <th>折扣应用</th>
                                        <th>促销码</th>
                                    </tr>
                                </thead>
                                <tbody id="data-table-body">
                                    <!-- 数据将通过JavaScript动态加载 -->
                                </tbody>
                            </table>
                        </div>
                        <nav>
                            <ul class="pagination justify-content-center" id="pagination">
                                <!-- 分页将通过JavaScript动态加载 -->
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title">CSV数据导入</h5>
                    </div>
                    <div class="card-body">
                        <form id="upload-form" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label for="csv-file" class="form-label">选择CSV文件</label>
                                <input class="form-control" type="file" id="csv-file" accept=".csv">
                            </div>
                            <button type="submit" class="btn btn-primary">上传并导入</button>
                        </form>
                        <div class="mt-3">
                            <div class="progress" style="display: none;">
                                <div class="progress-bar" role="progressbar" style="width: 0%"></div>
                            </div>
                            <div id="import-result" class="mt-2"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer mt-4 py-3 bg-light">
        <div class="container text-center">
            <span class="text-muted">购物趋势分析系统 &copy; 2023</span>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.3.2/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
