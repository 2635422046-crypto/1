server:
  port: 8080
  servlet:
    context-path: /
  tomcat:
    max-http-form-post-size: 100MB

spring:
  application:
    name: shopping-trends
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.101.101:3306/bigdata?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.shopping.trends.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    root: info
    com.shopping.trends: debug
  file:
    name: logs/shopping-trends.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30

# Swagger配置
swagger:
  enabled: true
  title: 购物趋势分析系统API
  description: 购物趋势分析系统接口文档
  version: 1.0.0
  contact:
    name: Admin
    email: admin@example.com
  base-package: com.shopping.trends.controller